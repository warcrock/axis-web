<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  /* Lo importante vive en los 630 px del medio (x 285–915): WhatsApp recorta la vista previa en cuadrado. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: #060807; color: #ECF1EE; font-family: Geist, sans-serif; }
  body { position: relative; overflow: hidden; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 60px 60px; background-position: 0 15px; mask-image: radial-gradient(ellipse 60% 70% at 50% 50%, #000 20%, transparent 80%); }
  .glow { position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(180,255,77,.14), transparent 62%); }
  .center { position: absolute; left: 300px; width: 600px; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .mark { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  .mark svg { width: 40px; height: 40px; }
  h1 { margin-top: 44px; font-family: "Geist Mono", monospace; font-weight: 600; font-size: 66px; line-height: 1.04; letter-spacing: -.03em; }
  h1 em { display: block; font-style: normal; color: #B4FF4D; }
  .sub { margin-top: 36px; font-size: 25px; color: #BAC5C0; line-height: 1.35; }
  .sub b { color: #ECF1EE; font-weight: 600; }
  .in, .out { position: absolute; font-family: "Geist Mono", monospace; }
  .in { left: 40px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; background: #0A0E0C; color: #8E9B96; font-size: 17px; }
  .in::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #FF8E8E; }
  .out { right: 40px; width: 210px; padding: 14px 16px; border: 1px solid rgba(180,255,77,.3); border-radius: 14px; background: #0F1712; }
  .out b { display: block; font-family: Geist, sans-serif; font-size: 19px; font-weight: 600; }
  .out span { display: block; margin-top: 4px; font-size: 14px; color: #8E9B96; }
  .out.on { background: #B4FF4D; border-color: #B4FF4D; color: #0A1400; }
  .out.on span { color: #2D4210; }
  .i1 { top: 150px; } .i2 { top: 290px; } .i3 { top: 430px; }
  .o1 { top: 130px; } .o2 { top: 270px; } .o3 { top: 410px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <p class="in i1">¿me pasás precio?</p>
  <p class="in i2">lista_VIEJA.pdf</p>
  <p class="in i3">14 sin leer</p>
  <div class="out o1 on"><b>Pedido armado</b><span>7 bultos · WhatsApp</span></div>
  <div class="out o2"><b>Informe del mes</b><span>se envía solo</span></div>
  <div class="out o3"><b>Turno confirmado</b><span>vie · 11:30</span></div>
  <div class="center">
    <p class="mark"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="none" stroke="#ECF1EE" stroke-width="1.5" opacity=".35"/><path d="M4 16h24M16 4v24" stroke="#ECF1EE" stroke-width="1.5"/><circle cx="16" cy="16" r="3.5" fill="#B4FF4D"/></svg>Axis</p>
    <h1>Tu negocio,<em>en automático.</em></h1>
    <p class="sub">Sistemas a medida para pymes<br><b>San Rafael, Mendoza</b> · y todo Cuyo</p>
  </div>
</body>
</html>
